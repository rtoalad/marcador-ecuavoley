<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador Ecuavoley</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to right, #f0f8ff, #e6f7ff);
    font-size: 3vw; /* tamaño base relativo */
    margin: 0;
    padding: 0;
  }

  .contenedor {
    display: flex;
    justify-content: center;
    gap: 5vw;
    flex-wrap: wrap; /* se acomoda en pantallas pequeñas */
  }

  .equipo {
    background-color: #ffffff;
    border-radius: 2vw;
    padding: 2vw;
    box-shadow: 0 0.5vw 1vw rgba(0,0,0,0.2);
    flex: 1 1 40%;
  }

  .equipo h2 {
    font-size: 5vw;
    color: #333;
  }

  .equipo h1 {
    font-size: 15vw;
    color: #0077b6;
  }

  button {
    margin: 1vw;
    padding: 2vw;
    font-size: 4vw;
    border: none;
    border-radius: 1vw;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.1);
  }

  .acciones {
    margin-top: 5vw;
  }

  .acciones button {
    background-color: #ff9800;
    color: white;
    margin: 2vw;
  }

  .activo {
    border: 0.8vw solid #d00000; /* marco rojo intenso */
    box-shadow: 0 0 2vw rgba(208,0,0,0.7);
  }

  .saque {
    vertical-align: middle;
    margin-left: 1vw;
    font-size: 5vw; /* pelota adaptativa */
  }
</style>

</head>
<body>
  <div class="contenedor">
    <div class="equipo equipoA">
      <h2 id="nombreA">Equipo A <span id="saqueA" class="saque">🏐</span></h2>
      <h1 id="equipoA">0</h1>
      <button onclick="sumarPunto('A')">+</button>
      <button onclick="restarPunto('A')">-</button>
    </div>

    <div class="equipo equipoB">
      <h2 id="nombreB">Equipo B <span id="saqueB" class="saque" style="visibility:hidden;">🏐</span></h2>
      <h1 id="equipoB">0</h1>
      <button onclick="sumarPunto('B')">+</button>
      <button onclick="restarPunto('B')">-</button>
    </div>
  </div>
  <div class="configuracion">
    <label for="maximo">Número máximo:</label>
    <input type="number" id="maximo" value="8" min="1" max="10">
  </div>
    <div class="acciones">
    <button onclick="intercambiar()">↔ Intercambiar</button>
    <button onclick="cambio()">Cambio</button>
    <button onclick="reiniciar()">⟳ Reiniciar</button>
  </div>

  <script>
    window.onload = actualizar;

    let puntosA = 0;
    let puntosB = 0;
    let saque = "A"; // equipo que tiene el saque
    let sonidoEmitido = false; // controla si ya sonó

    function actualizar() {
      document.getElementById("equipoA").innerText = puntosA;
      document.getElementById("equipoB").innerText = puntosB;

      // mostrar el ● solo en el equipo con saque
      document.getElementById("saqueA").style.visibility = saque === "A" ? "visible" : "hidden";
      document.getElementById("saqueB").style.visibility = saque === "B" ? "visible" : "hidden";

      // aplicar marco rojo al equipo con saque
      document.querySelector(".equipoA").classList.toggle("activo", saque === "A");
      document.querySelector(".equipoB").classList.toggle("activo", saque === "B");
    }

    function cambio() {
      saque = saque === "A" ? "B" : "A";
      actualizar();
    }

    function intercambiar() {
      // intercambiar puntos
      [puntosA, puntosB] = [puntosB, puntosA];

      // intercambiar nombres (solo texto, no IDs)
      let nombreA = document.getElementById("nombreA").childNodes[0].nodeValue.trim();
      let nombreB = document.getElementById("nombreB").childNodes[0].nodeValue.trim();
      document.getElementById("nombreA").childNodes[0].nodeValue = nombreB + " ";
      document.getElementById("nombreB").childNodes[0].nodeValue = nombreA + " ";

      // intercambiar saque (variable y visual)
      saque = saque === "A" ? "B" : "A";

      actualizar();
    }

    function reiniciar() {
      puntosA = 0;
      puntosB = 0;
      saque = "A";
      sonidoEmitido = false; // permite que vuelva a sonar
      actualizar();
    }

    function sumarPunto(equipo) {
      if (saque === equipo) {
        if (equipo === "A") puntosA++;
        else puntosB++;
        actualizar();
        verificarMaximo(); // 👈 aquí
      }
    }

    function restarPunto(equipo) {
      if (equipo === "A" && puntosA > 0) puntosA--;
      else if (equipo === "B" && puntosB > 0) puntosB--;
      actualizar();
      verificarMaximo();
    }

    function verificarMaximo() {
      let maximo = 8; // fijo en 8

      if (!sonidoEmitido && (puntosA === maximo || puntosB === maximo)) {
        reproducirSonido();
        sonidoEmitido = true; // marca que ya sonó
      }
    }

    function reproducirSonido() {
      let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let oscillator = audioCtx.createOscillator();
      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // tono A4
      oscillator.connect(audioCtx.destination);
      oscillator.start();

      // detener después de 3 segundos
      setTimeout(() => {
        oscillator.stop();
        audioCtx.close();
      }, 3000);
    }
    
  </script>
</body>
</html>
